services:
  db:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_USER: aiko
      POSTGRES_PASSWORD: aiko
      POSTGRES_DB: aiko
    volumes:
      - aiko_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiko -d aiko"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    command: ["sh", "-lc", "pnpm db:generate && node scripts/dev-watch.mjs"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - ./frontend/.env
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "1000"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    command: ["pnpm", "exec", "next", "dev", "--hostname", "0.0.0.0", "--webpack"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  aiko_pg:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:
