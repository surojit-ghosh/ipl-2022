services:
  db:
    image: postgres:16.15-alpine3.24

    environment:
      POSTGRES_USER: aiko
      POSTGRES_PASSWORD: aiko
      POSTGRES_DB: aiko

    ports:
      - "5432:5432"

    volumes:
      - aiko_pg:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiko -d aiko"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: aiko-backend:dev
    command: ["pnpm", "dev"]

    env_file:
      - ./backend/.env

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "3001:3001"

    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: aiko-frontend:dev
    command: ["pnpm", "dev"]

    environment:
      - BACKEND_URL=http://backend:3001

    env_file:
      - ./frontend/.env

    depends_on:
      - backend

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules


volumes:
  aiko_pg:
  backend_node_modules:
  frontend_node_modules: