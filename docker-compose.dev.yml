services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiko
      POSTGRES_PASSWORD: aiko
      POSTGRES_DB: aiko
    ports:
      - "5433:5432"
    volumes:
      - aiko_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiko -d aiko"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgresql://aiko:aiko@db:5432/aiko
      PORT: "3001"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  aiko_pg:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:
