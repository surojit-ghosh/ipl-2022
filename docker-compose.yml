services:
  db:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_USER: aiko
      POSTGRES_PASSWORD: aiko
      POSTGRES_DB: aiko
    volumes:
      - aiko_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiko -d aiko"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: ghcr.io/surojit-ghosh/ipl-2022-migrate:latest
    env_file:
      - ./backend/.env
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    image: ghcr.io/surojit-ghosh/ipl-2022-backend:latest
    env_file:
      - ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: ghcr.io/surojit-ghosh/ipl-2022-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  aiko_pg:
  caddy_data:
  caddy_config:
